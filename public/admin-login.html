<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#090b10">
  <title>Login Admin — BLACKMAMERSTUDIO</title>
  <link rel="icon" href="/assets/favicon.ico">
  <style>
  :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;color:#f2f2f4;background:radial-gradient(ellipse 62% 46% at 50% 8%,#7e142c39,transparent 80%),radial-gradient(ellipse 48% 32% at 0 100%,#a5112820,transparent 100%),#080a0e}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}
  .wrap{position:relative;width:min(440px,100%)}
  .back{display:inline-flex;gap:8px;align-items:center;color:#a4a5ad;text-decoration:none;font-size:13px;margin:0 0 20px;transition:color .2s}.back:hover{color:white}
  .card{overflow:hidden;border:1px solid #ffffff1b;border-radius:22px;background:linear-gradient(155deg,#191a21 0%,#101117 48%,#0e0e12 100%);box-shadow:0 24px 85px #0009,0 0 55px #ac1b3420;animation:rise .5s ease both}
  .top{height:3px;background:linear-gradient(90deg,transparent,#d92247,#e8a3b1,#d92247,transparent)}
  .inner{padding:36px}
  .brand{display:flex;align-items:center;gap:14px}.brand img{width:53px;height:53px;object-fit:contain}.brand strong{display:block;font-size:16px;letter-spacing:.08em}.brand small{display:block;color:#a0a2af;letter-spacing:.13em;font-size:10px;margin-top:5px}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #d532493d;background:#cd203120;border-radius:30px;padding:6px 10px;color:#ff92a3;font-size:10px;font-weight:700;letter-spacing:.14em;margin-top:30px}.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:#ff5471;box-shadow:0 0 10px #ff5471}
  h1{margin:14px 0 7px;font-size:28px;line-height:1.1;letter-spacing:-.03em}p{margin:0 0 28px;color:#9fa2b0;font-size:13px;line-height:1.6}
  label{display:block;font-size:12px;color:#cdd0da;margin-bottom:8px;font-weight:600}
  .field{margin-top:17px}.control{position:relative}
  input{width:100%;height:47px;color:#fff;border:1px solid #383943;border-radius:10px;background:#111319;padding:0 14px;outline:0;font:inherit;font-size:14px;transition:border-color .2s,box-shadow .2s}
  input::placeholder{color:#767986}input:focus{border-color:#ec435b;box-shadow:0 0 0 3px #ec435b20}
  .show{position:absolute;right:9px;top:6px;width:auto;height:35px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:#a9acba;cursor:pointer}
  #error{min-height:22px;color:#ff8e9f;font-size:12px;padding-top:10px;line-height:1.45}
  .submit{margin-top:10px;width:100%;height:49px;border:1px solid #f45b75a6;border-radius:10px;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(125deg,#a8142e,#e32247);box-shadow:0 9px 28px #dd24462e;transition:filter .2s,transform .2s}
  .submit:hover{filter:brightness(1.13);transform:translateY(-1px)}.submit:disabled{opacity:.6;cursor:progress;transform:none}
  .footer{display:flex;align-items:center;justify-content:center;padding:16px;color:#777b88;border-top:1px solid #ffffff13;font-size:11px;letter-spacing:.04em}
  @keyframes rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
  @media(max-width:420px){.inner{padding:26px}h1{font-size:25px}}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/id">← Kembali ke Beranda</a>
    <section class="card" aria-labelledby="page-title">
      <div class="top"></div>
      <div class="inner">
        <div class="brand"><img src="/assets/icon.png" alt=""><div><strong>BLACKMAMERSTUDIO</strong><small>ADMIN CONTROL CENTER</small></div></div>
        <div class="pill">AKSES TERBATAS</div>
        <h1 id="page-title">Login Administrator</h1>
        <p>Masuk menggunakan akun administrator untuk membuka panel kontrol.</p>
        <form id="admin-form">
          <div class="field"><label for="username">Username Admin</label><div class="control"><input id="username" name="username" placeholder="Masukkan username" autocomplete="username" required autofocus></div></div>
          <div class="field"><label for="password">Password Admin</label><div class="control"><input id="password" name="password" placeholder="Masukkan password" type="password" autocomplete="current-password" required><button class="show" id="show-pass" type="button" aria-label="Tampilkan password">Lihat</button></div></div>
          <div role="alert" id="error" aria-live="polite"></div>
          <button class="submit" id="submit" type="submit">Masuk ke Dashboard →</button>
        </form>
      </div>
      <div class="footer">© 2026 BLACKMAMERSTUDIO · SECURE ADMIN ACCESS</div>
    </section>
  </div>
  <script>
  (() => {
    const form = document.getElementById('admin-form');
    const error = document.getElementById('error');
    const button = document.getElementById('submit');
    const pass = document.getElementById('password');
    const username = document.getElementById('username');
    const toggle = document.getElementById('show-pass');
    toggle.addEventListener('click', () => {
      const show = pass.type === 'password';
      pass.type = show ? 'text' : 'password';
      toggle.textContent = show ? 'Sembunyikan' : 'Lihat';
      toggle.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      error.textContent = '';
      try {
        const res = await fetch('/auth/admin-login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({username: username.value, password: pass.value})
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          location.assign('/dashboard#/admin');
          return;
        }
        error.textContent = data.error || 'Login admin gagal. Coba lagi.';
      } catch {
        error.textContent = 'Tidak bisa menghubungi server. Coba lagi.';
      } finally {
        button.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
