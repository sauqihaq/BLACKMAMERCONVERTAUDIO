
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#09090f">
<title>Login Admin | BLACKMAMERSTUDIO</title>
<link rel="icon" href="/assets/favicon.ico">
<style>
  :root {
    color-scheme: dark;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    padding: 24px;
    display: grid;
    place-items: center;
    background: radial-gradient(ellipse 65% 38% at 50% 0%, #8a15352d, transparent), #09090f;
    color: #f6f6fa;
  }
  .wrap { width: min(440px, 100%); position: relative; }
  .back {
    display: inline-block;
    margin-bottom: 18px;
    color: #9fa3b4;
    text-decoration: none;
    font-size: 13px;
  }
  .back:hover { color: #fff; }
  .card {
    overflow: hidden;
    border: 1px solid #ffffff1b;
    border-radius: 22px;
    background: linear-gradient(150deg, #1b1b24, #101117 70%, #0d0d11);
    box-shadow: 0 25px 90px #0008, 0 0 60px #b30b2914;
    animation: enter .6s ease both;
  }
  .line {
    height: 3px;
    background: linear-gradient(90deg, transparent, #e1264d, #f39fac, #e1264d, transparent);
  }
  .inner { padding: 36px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 54px; height: 54px; object-fit: contain; }
  .brand strong {
    font-size: 16px;
    letter-spacing: .07em;
    display: block;
  }
  .brand small {
    display: block;
    color: #9ca0ae;
    font-size: 10px;
    letter-spacing: .15em;
    margin-top: 5px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 32px;
    border: 1px solid #e7345844;
    border-radius: 99px;
    padding: 7px 11px;
    color: #ffa2b1;
    background: #dc22401a;
    font-size: 10px;
    letter-spacing: .12em;
    font-weight: 800;
  }
  .pill::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #f34e70;
    box-shadow: 0 0 12px #f34e70;
  }
  h1 {
    font-size: 29px;
    margin: 15px 0 8px;
    letter-spacing: -.03em;
  }
  p {
    margin: 0 0 28px;
    color: #a3a6b3;
    font-size: 13px;
    line-height: 1.7;
  }
  label {
    display: block;
    font-size: 12px;
    color: #cdd0dc;
    font-weight: 650;
    margin-bottom: 9px;
  }
  .field { margin-top: 19px; }
  .control { position: relative; }
  input {
    width: 100%;
    height: 48px;
    border-radius: 10px;
    border: 1px solid #383b48;
    background: #151720;
    color: white;
    outline: none;
    padding: 0 14px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus {
    border-color: #f34e70;
    box-shadow: 0 0 0 3px #e92e4c23;
  }
  .eye {
    position: absolute;
    right: 8px;
    top: 7px;
    min-width: 62px;
    height: 34px;
    border: 0;
    background: transparent;
    color: #a6a8b4;
    cursor: pointer;
  }
  .error {
    min-height: 24px;
    margin-top: 9px;
    color: #ff8a9c;
    font-size: 12px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .submit {
    width: 100%;
    height: 49px;
    border-radius: 10px;
    border: 1px solid #f55a76a8;
    background: linear-gradient(110deg, #a91735, #e4234c);
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 10px 30px #da244234;
    transition: transform .2s, filter .2s;
  }
  .submit:hover {
    filter: brightness(1.12);
    transform: translateY(-1px);
  }
  .submit:disabled {
    opacity: .65;
    cursor: wait;
    transform: none;
  }
  .foot {
    padding: 17px;
    text-align: center;
    font-size: 11px;
    color: #818493;
    border-top: 1px solid #ffffff14;
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media(max-width:480px) {
    .inner { padding: 25px; }
    h1 { font-size: 26px; }
  }
  @media(prefers-reduced-motion:reduce) {
    .card { animation: none; }
    .submit { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/id">← Kembali ke Beranda</a>
  <main class="card">
    <div class="line"></div>
    <div class="inner">
      <div class="brand">
        <img src="/assets/icon.png" alt="Logo BLACKMAMERSTUDIO">
        <div>
          <strong>BLACKMAMERSTUDIO</strong>
          <small>ADMIN CONTROL CENTER</small>
        </div>
      </div>

      <div class="pill">AKSES TERBATAS</div>
      <h1>Login Administrator</h1>
      <p>Masuk menggunakan akun administrator untuk membuka panel kontrol.</p>

      <form id="adminForm">
        <div class="field">
          <label for="username">Username Admin</label>
          <div class="control">
            <input id="username" name="username" autocomplete="username" placeholder="Masukkan username" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password Admin</label>
          <div class="control">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
            <button id="toggle" class="eye" type="button">Lihat</button>
          </div>
        </div>

        <div id="message" class="error" role="alert" aria-live="polite"></div>
        <button id="submit" class="submit" type="submit">Masuk ke Dashboard →</button>
      </form>
    </div>

    <div class="foot">© 2026 BLACKMAMERSTUDIO · SECURE ADMIN ACCESS</div>
  </main>
</div>

<script>
(() => {
  const form = document.getElementById('adminForm');
  const username = document.getElementById('username');
  const password = document.getElementById('password');
  const button = document.getElementById('submit');
  const message = document.getElementById('message');
  const toggle = document.getElementById('toggle');

  toggle.addEventListener('click', () => {
    const show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Sembunyikan' : 'Lihat';
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    button.disabled = true;
    button.textContent = 'Memproses login...';
    message.textContent = '';

    try {
      const response = await fetch('/auth/admin-login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: username.value.trim(),
          password: password.value
        })
      });

      const type = response.headers.get('content-type') || '';

      if (!type.includes('application/json')) {
        message.textContent = `Backend belum mengembalikan JSON (HTTP ${response.status}). Periksa routing Vercel dan Runtime Logs.`;
        return;
      }

      let result;
      try {
        result = await response.json();
      } catch {
        message.textContent = `Respons JSON backend rusak (HTTP ${response.status}).`;
        return;
      }

      if (response.ok && result.ok) {
        window.location.assign('/dashboard#/admin');
        return;
      }

      message.textContent = result.error || `Login gagal (HTTP ${response.status}).`;
    } catch {
      message.textContent = 'Gagal menghubungi backend. Periksa koneksi dan Vercel Runtime Logs.';
    } finally {
      button.disabled = false;
      button.textContent = 'Masuk ke Dashboard →';
    }
  });
})();
</script>
</body>
</html>
