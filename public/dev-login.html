<!doctype html>
<html lang="id"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BLACKMAMERSTUDIO — Local Preview</title><link rel="icon" href="/assets/favicon.ico"/>
<link rel="stylesheet" href="/assets/core.css"/><link rel="stylesheet" href="/assets/app.css"/><link rel="stylesheet" href="/assets/premium.css"/>
<style>.preview-wrap{min-height:100svh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 15%,#6d12364a,transparent 52%),#07080b}
.preview-card{width:min(440px,100%);padding:30px;border:1px solid #b0395555;border-radius:20px;background:#121017;box-shadow:0 18px 70px #000c}
.preview-logo{display:block;width:245px;max-width:100%;height:auto;margin:0 auto 8px}.preview-card h1{font-size:24px;text-align:center;margin:0 0 8px}
.preview-card p{font-size:12px;line-height:1.7;color:#b2a6b0;text-align:center;margin:0 0 22px}
.preview-form{display:grid;gap:13px}.preview-form label{font-size:11px;letter-spacing:.08em;color:#ef8da2}
.preview-form input{width:100%;margin-top:5px}.preview-form button{width:100%;height:45px;margin-top:8px}
#result{min-height:20px;color:#ff8a9d;font-size:12px;text-align:center}</style></head>
<body class="app"><div class="preview-wrap"><div class="preview-card"><img class="preview-logo" src="/assets/logo.webp" alt="BLACKMAMERSTUDIO"/>
<h1>Local Preview Login</h1><p>Mode lokal untuk menguji dashboard tanpa akun Discord. Ini bukan login produksi dan tidak boleh diaktifkan di server publik.</p>
<form class="preview-form" id="login-form"><label>TEST USER ID<input class="input" id="id" inputmode="numeric" pattern="[0-9]{5,25}" value="123456789" required maxlength="25"/></label>
<label>DISPLAY NAME<input class="input" id="name" value="Blackmamer Creator" maxlength="50"/></label>
<button type="submit" class="btn" id="login-btn">Enter Workspace ↗</button><div id="result" role="status" aria-live="polite"></div></form>
<a href="/id" style="display:block;text-align:center;margin-top:8px;color:#ad9aa4;font-size:12px">← Back to landing page</a>
</div></div><script>
  document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();
  const button=document.getElementById('login-btn');button.disabled=true;
  const result=document.getElementById('result');result.textContent='Signing in...';
  try{const response=await fetch('/auth/dev-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:document.getElementById('id').value,name:document.getElementById('name').value})});
  const data=await response.json();if(!response.ok)throw Error(data.error||'Sign in failed');location.href='/dashboard';}
  catch(err){result.textContent=err.message;button.disabled=false;}});
</script></body></html>
